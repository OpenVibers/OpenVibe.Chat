## ═══════════════════════════════════════════════════════════════
## openvibe.party — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.party.conf — keep them in sync and reload nginx
## after changing it.
##
## OpenVibe.Chat (port 4400, systemd unit openvibe-chat) serves this host too, by the Host header
## (server/web/party-pages.js): the party page shell and its start form, openvibe.party's own sign-in
## (server/web/session.js, redirect <this host>/auth/callback on Chat's OAuth client), and the same
## Chat API and /ws/chat the party's chat and clock use. nginx terminates TLS, sets the client address
## from the connection only (Cloudflare → nginx → Node, as Chat's own vhost does), and caches nothing:
## Chat's Cache-Control decides.
##
## The zone names carry the party prefix: nginx refuses a duplicate limit_req_zone across the whole
## configuration, and openvibe.chat.conf already defines ovchat_*.
## Install: sudo ov-vhost-install deploy/nginx/openvibe.party.conf openvibe.party.conf
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovparty_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovparty_auth:10m rate=10r/m;
map $request_method $ovparty_write_key { default ""; POST $binary_remote_addr; }
limit_req_zone $ovparty_write_key zone=ovparty_write:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.party www.openvibe.party;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.party$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.party;
    ssl_certificate     /etc/letsencrypt/live/openvibe.party/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.party/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://openvibe.party$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.party;
    include snippets/security-txt.conf;   # /.well-known/security.txt (host file; SECURITY.md in every repo)

    ssl_certificate     /etc/letsencrypt/live/openvibe.party/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.party/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.party.access.log;
    error_log  /var/log/nginx/openvibe.party.error.log;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml text/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    # Host-only surfaces (the app refuses them from the proxy too).
    location ~* ^/metrics(/|$) { return 404; }
    location ~* ^/internal(/|$) { return 404; }
    location ~* ^/api/v1/resources(/|$) { return 404; }

    # The party's socket: its chat, presence, the shared clock and the control lease all ride it.
    # A location's proxy_set_header replaces every server-level one, so the client address is set here
    # again, from the connection only (never a forwarded header from the client).
    location ^~ /ws/chat {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The session probe the shared navbar asks on every page view: on its own budget, as on openvibe.chat.
    location = /auth/me {
        limit_req zone=ovparty_api burst=30 nodelay;
        limit_req_status 429;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4400;
    }

    location /auth/ {
        limit_req zone=ovparty_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4400;
    }

    location /api/ {
        limit_req zone=ovparty_api burst=40 nodelay;
        client_max_body_size 10m;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4400;
    }

    location / {
        limit_req zone=ovparty_write burst=20 nodelay;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4400;
    }
}
