# OpenVibe.Chat locations — include INSIDE the `server { listen 443 … server_name openvibe.live … }`
# block of /etc/nginx/sites-enabled/openvibe.live.conf (Live's deploy/nginx/openvibe.live.conf),
# above `location /api/`:
#
#     include /opt/openvibe.chat/deploy/nginx/openvibe.live-chat.locations.conf;
#
# Adding the include (+ nginx -t + reload) is the traffic flip; removing it is the rollback
# (docs/cutover.md). Headers and limits are Live's for the same paths: the /api/ zone and burst,
# the body size, X-Forwarded-For for trust proxy 2, CF-Connecting-IP + upgrade for the socket.
# `^~` keeps the static-asset regex location from ever taking these (e.g. /api/sounds/file/x.mp3).
# Trailing slashes matter: /api/chat-ai (Live's AI routes) must NOT match /api/chat/.

location ^~ /ws/chat {
    proxy_pass http://127.0.0.1:4400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location ^~ /api/chat/ {
    limit_req zone=api_limit burst=40 nodelay;
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:4400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

