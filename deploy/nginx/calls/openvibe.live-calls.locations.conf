# OpenVibe.Chat call locations (roadmap WS-I task 1) — include INSIDE the `server { listen 443 …
# server_name openvibe.live … }` block of /etc/nginx/sites-enabled/openvibe.live.conf, next to the
# chat include and above `location /api/`:
#
#     include /opt/openvibe.chat/deploy/nginx/calls/openvibe.live-calls.locations.conf;
#
# This file sits in calls/ on purpose: Live's vhost already includes deploy/nginx/*.locations.conf,
# so a file named like that one directory up would send calls to Chat at the first nginx reload after
# a Chat deploy — before Chat runs with CHAT_CALLS=1 and Live with CALLS_AUTHORITY=chat. Adding the
# include line (+ nginx -t + reload) is the flip; removing it is the rollback (docs/calls-cutover.md).
#
# Headers and limits are Live's for the same paths (the /api/ zone and burst, the client address
# from the connection only, upgrade for the socket). `^~` keeps every regex location (the static-asset
# one) from taking the prefix paths. Everything else under /api/streams/ stays on Live.

location ^~ /ws/call {
    proxy_pass http://127.0.0.1:4400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# GET/POST /api/streams/voice-channels, GET/DELETE …/:channelId, POST …/call-user and …/call-user/respond
location ^~ /api/streams/voice-channels {
    limit_req zone=api_limit burst=40 nodelay;
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:4400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# GET/PUT /api/streams/<id>/call. A regex location: it wins over Live's plain `location /api/` prefix,
# and only this exact shape leaves Live (/api/streams/<id>, /<id>/end, … do not match).
location ~ ^/api/streams/[0-9]+/call$ {
    limit_req zone=api_limit burst=40 nodelay;
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:4400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
